<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSF Dev Console</title>
<!-- A 파트 개발용 최소 대시보드. B 의 index.html 과 별개이며 통합 후에도 디버깅용으로 남긴다.
     docs/03-messages.md §2, §3.2 의 메시지를 그대로 쓴다. ?s=<session> 으로 기존 세션에 붙는다. -->
<style>
  body { margin:0; font:14px/1.4 system-ui, "Noto Sans KR", sans-serif; background:#f4f3ef; color:#1a1d1f; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:#1a1d1f; color:#eee; flex-wrap:wrap; }
  header b { font-size:15px; } header span { color:#aab; }
  main { display:grid; grid-template-columns:minmax(0, 1fr) 320px; gap:14px; padding:14px 16px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .stage { position:relative; background:#111; border-radius:6px; min-height:200px; }
  .stage img { display:block; width:100%; border-radius:6px; }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  .counts { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
  .counts div { background:#fff; border:1px solid #ddd; border-radius:6px; padding:8px 10px; }
  .counts b { display:block; font:600 24px ui-monospace, monospace; }
  aside section { background:#fff; border:1px solid #ddd; border-radius:6px; padding:10px 12px; margin-bottom:12px; }
  aside h3 { margin:0 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#666; }
  label { display:flex; justify-content:space-between; gap:8px; margin:6px 0; }
  input, select { width:110px; }
  button { padding:7px 10px; margin:2px 4px 2px 0; }
  pre { margin:0; font:12px ui-monospace, monospace; white-space:pre-wrap; max-height:260px; overflow:auto; }
  #qr { width:150px; height:150px; background:#eee; }
  .muted { color:#777; font-size:12px; word-break:break-all; }
</style>
</head>
<body>
<header>
  <b>PSF Dev Console</b><span id="sess">세션 없음</span><span id="conn">WS 끊김</span><span id="phone">폰 없음</span>
  <a href="/sim/" target="_blank" style="color:#9cf">시뮬레이터 열기</a>
</header>
<main>
  <div>
    <div class="stage"><img id="frame" alt=""><canvas id="overlay"></canvas></div>
    <div class="counts">
      <div>검사 통과<b id="total">0</b></div><div>정상<b id="ok">0</b></div><div>불량<b id="ng">0</b></div>
    </div>
    <p class="muted" id="frameinfo"></p>
  </div>
  <aside>
    <section>
      <h3>폰 연결</h3>
      <img id="qr" alt="QR"><p class="muted" id="phoneurl"></p>
      <button id="newsess">새 세션</button>
    </section>
    <section>
      <h3>설정</h3>
      <label>검사선 line_x <input id="line_x" type="number" step="0.01" min="0" max="1"></label>
      <label>방향 <select id="direction"><option>rtl</option><option>ltr</option></select></label>
      <label>원형도 circ_th <input id="circ_th" type="number" step="0.01"></label>
      <label>볼록도 solid_th <input id="solid_th" type="number" step="0.005"></label>
      <label>precise <select id="precise_policy"><option>uncertain</option><option>interval</option><option>off</option></select></label>
      <button id="apply">적용</button>
    </section>
    <section>
      <h3>ROI · 카운트</h3>
      <button id="roiEdit">ROI 4점 지정</button><button id="roiClear">ROI 해제</button><button id="reset">reset</button>
      <p class="muted" id="roiinfo">좌상 → 우상 → 우하 → 좌하 순서로 시뮬레이터 캔버스 모서리를 클릭</p>
    </section>
    <section><h3>stats</h3><pre id="stats">–</pre></section>
  </aside>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const CFG_KEYS = ['line_x', 'direction', 'circ_th', 'solid_th', 'precise_policy'];
  let ws = null, sid = null, lastUrl = null, roiPts = null, lastHeader = null;

  async function ensureSession(forceNew) {
    const want = forceNew ? null : (new URLSearchParams(location.search).get('s') || localStorage.getItem('psf.session'));
    if (want) {
      const r = await fetch(`/api/sessions/${want}`);
      if (r.ok) return r.json();
    }
    const r = await fetch('/api/sessions', { method: 'POST' });
    return r.json();
  }

  function showSession(info) {
    sid = info.session;
    try { localStorage.setItem('psf.session', sid); } catch (e) {}
    history.replaceState(null, '', `?s=${sid}`);
    $('sess').textContent = 'session ' + sid;
    $('phoneurl').textContent = info.phone_url || '공개 URL 대기 중 (터널 기동 중)…';
    $('qr').src = info.phone_url ? `${info.qr_url}?t=${Date.now()}` : '';
  }

  function connect() {
    if (ws) { ws.onclose = null; ws.close(); }  // 세션을 바꿀 때 이전 소켓이 재연결하지 않도록
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws/dashboard?s=${sid}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { $('conn').textContent = 'WS 연결됨'; };
    ws.onclose = () => { $('conn').textContent = 'WS 끊김 — 재연결'; setTimeout(connect, 2000); };
    ws.onmessage = ev => typeof ev.data === 'string' ? onText(JSON.parse(ev.data)) : onResult(ev.data);
  }

  function onText(m) {
    if (m.type === 'session') showSession(m);
    else if (m.type === 'config') for (const k of CFG_KEYS) $(k).value = m.config[k];
    else if (m.type === 'phone') $('phone').textContent = m.connected ? '폰 연결됨' : '폰 없음';
    else if (m.type === 'stats') $('stats').textContent = JSON.stringify(m, null, 1);
    else if (m.type === 'error') alert(`${m.code}: ${m.message}`);
  }

  // result 봉투: [uint32 BE 헤더 길이][헤더 JSON][JPEG]
  function onResult(buf) {
    const n = new DataView(buf).getUint32(0);
    const h = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n)));
    lastHeader = h;
    const url = URL.createObjectURL(new Blob([new Uint8Array(buf, 4 + n)], { type: 'image/jpeg' }));
    $('frame').src = url;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;
    $('total').textContent = h.counts.total; $('ok').textContent = h.counts.ok; $('ng').textContent = h.counts.ng;
    $('frameinfo').textContent = `seq ${h.seq} · ${h.w}×${h.h} · tracks ${h.tracks.length} · latency ${JSON.stringify(h.latency_ms)}`;
    drawRoi();
  }

  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  $('apply').onclick = () => {
    const c = {};
    for (const k of CFG_KEYS) c[k] = $(k).type === 'number' ? parseFloat($(k).value) : $(k).value;
    send({ type: 'config', config: c });
  };
  $('reset').onclick = () => send({ type: 'reset' });
  $('roiClear').onclick = () => { roiPts = null; send({ type: 'roi', points: null }); drawRoi(); };
  $('roiEdit').onclick = () => {
    // ROI 를 지정하는 동안에는 보정 전 원본이 보여야 하므로 먼저 ROI 를 해제한다
    roiPts = [];
    send({ type: 'roi', points: null });
    $('roiinfo').textContent = '원본 화면에서 4점을 클릭하세요 (0/4)';
    drawRoi();
  };
  $('overlay').addEventListener('click', ev => {
    if (!roiPts || roiPts.length >= 4) return;
    const r = ev.target.getBoundingClientRect();
    roiPts.push([+((ev.clientX - r.left) / r.width).toFixed(4), +((ev.clientY - r.top) / r.height).toFixed(4)]);
    $('roiinfo').textContent = `원본 화면에서 4점을 클릭하세요 (${roiPts.length}/4)`;
    if (roiPts.length === 4) { send({ type: 'roi', points: roiPts }); $('roiinfo').textContent = 'ROI 적용: ' + JSON.stringify(roiPts); roiPts = null; }
    drawRoi();
  });

  function drawRoi() {
    const cv = $('overlay'), r = cv.getBoundingClientRect();
    cv.width = r.width; cv.height = r.height;
    const g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    if (!roiPts) return;
    g.fillStyle = g.strokeStyle = '#ffd400'; g.lineWidth = 2;
    g.beginPath();
    roiPts.forEach(([x, y], i) => { const px = x * cv.width, py = y * cv.height; i ? g.lineTo(px, py) : g.moveTo(px, py); g.fillRect(px - 4, py - 4, 8, 8); });
    g.stroke();
  }

  $('newsess').onclick = async () => { showSession(await ensureSession(true)); connect(); };
  setInterval(() => send({ type: 'ping' }), 20000);
  ensureSession(false).then(info => { showSession(info); connect(); });
})();
</script>
</body>
</html>
