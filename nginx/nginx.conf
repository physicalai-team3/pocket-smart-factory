events {}

http {
  include       /etc/nginx/mime.types;
  client_max_body_size 8m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # C3 복제본: Docker 내장 DNS(127.0.0.11)를 10초마다 다시 조회한다 (nginx 1.27.3+ 오픈소스의 `resolve`).
  # → C3 개수를 바꿔도 `docker compose restart web` 이 필요 없다.
  # least_conn: SAM 2(precise)처럼 오래 걸리는 요청을 처리 중인 복제본을 피해 fast 프레임을 보낸다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream c3_pool {
    zone c3_pool 64k;
    least_conn;
    server c3-inference:8003 resolve;
  }

  # ── 공개 서버 (cloudflared 터널, localhost:8080) ──
  server {
    listen 80;
    root /usr/share/nginx/html;

    location / { try_files $uri $uri/ =404; }

    location /api/ {
      proxy_pass http://c1-gateway:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ws/ {
      proxy_pass http://c1-gateway:8001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  # ── 내부 전용: C1 → C3 로드밸런서 (호스트/터널에 공개하지 않음) ──
  server {
    listen 8090;
    location / {
      proxy_pass http://c3_pool;
      proxy_read_timeout 10s;
    }
  }
}
