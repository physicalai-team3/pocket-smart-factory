# 구조와 포트: docs/01-architecture.md, 환경변수: docs/02-containers.md
name: pocket-smart-factory

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"            # 대시보드: http://localhost:8080  (8090 내부 LB는 공개하지 않음)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on: [c1-gateway, c3-inference]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://web:80
    depends_on: [web]
    restart: unless-stopped

  c1-gateway:
    build: { context: ., dockerfile: services/c1_gateway/Dockerfile }
    env_file: .env
    environment:
      CLOUDFLARED_METRICS: http://cloudflared:2000
      C2_URL: http://c2-preprocess:8002
      C3_URL: http://web:8090
      C4_URL: http://c4-visualizer:8004
    depends_on: [c2-preprocess, c4-visualizer]

  c2-preprocess:
    build: { context: ., dockerfile: services/c2_preprocess/Dockerfile }
    env_file: .env

  c3-inference:
    build:
      context: .
      dockerfile: services/c3_inference/Dockerfile
      args:
        WITH_SAM2: ${WITH_SAM2:-0}
    env_file: .env
    volumes:
      - ./models:/models:ro
    deploy:
      replicas: ${C3_REPLICAS:-2}

  c4-visualizer:
    build: { context: ., dockerfile: services/c4_visualizer/Dockerfile }
    env_file: .env
