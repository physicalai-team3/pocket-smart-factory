# 구조와 포트: docs/01-architecture.md, 환경변수: docs/02-containers.md
# 개발 중 C3·C4 를 스텁으로 바꾸려면: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
name: pocket-smart-factory

# 모든 Python 서비스는 GET /health 를 제공한다. 이미지에 curl 이 없어 python 으로 확인한다.
x-health: &health
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  web:
    image: nginx:1.27.5-alpine   # upstream `server ... resolve` 는 1.27.3+ 필요 → 태그를 고정
    ports:
      - "8080:80"            # 대시보드: http://localhost:8080  (8090 내부 LB는 공개하지 않음)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      c1-gateway: { condition: service_healthy }
      c3-inference: { condition: service_started }
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://web:80
    depends_on: [web]
    restart: unless-stopped

  c1-gateway:
    build: { context: ., dockerfile: services/c1_gateway/Dockerfile }
    env_file: .env
    environment:
      CLOUDFLARED_METRICS: http://cloudflared:2000
      C2_URL: http://c2-preprocess:8002
      C3_URL: http://web:8090
      C4_URL: http://c4-visualizer:8004
    depends_on:
      c2-preprocess: { condition: service_healthy }
      c4-visualizer: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/public-url', timeout=2)"]
    restart: unless-stopped

  c2-preprocess:
    build: { context: ., dockerfile: services/c2_preprocess/Dockerfile }
    env_file: .env
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
    restart: unless-stopped

  c3-inference:
    build:
      context: .
      dockerfile: services/c3_inference/Dockerfile
      args:
        WITH_SAM2: ${WITH_SAM2:-0}
    env_file: .env
    volumes:
      - ./models:/models:ro
    deploy:
      replicas: ${C3_REPLICAS:-2}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=2)"]
    restart: unless-stopped

  c4-visualizer:
    build: { context: ., dockerfile: services/c4_visualizer/Dockerfile }
    env_file: .env
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)"]
    restart: unless-stopped
